name: CI

on:
  push:
  pull_request:

jobs:
  docker-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas
      
      # ✅ Let Compose build using the contexts defined in docker/docker-compose.ci.yml
      - name: Compose build
        run: docker compose -f docker/docker-compose.ci.yml build 

      # ✅ Bring the stack up and wait for containers to be running
      - name: Compose up (with wait)
        run: |
          docker compose -f docker/docker-compose.ci.yml up -d --build --wait --wait-timeout 180
          docker compose -f docker/docker-compose.ci.yml ps

      # ✅ Gate on actual readiness of each endpoint, not just "container is running"
      - name: Wait for app & observability to be ready
        env:
          FRONTEND_URL: http://localhost:8080
          BACKEND_URL:  http://localhost:8081
          PROM_URL:     http://localhost:9090
          GRAFANA_URL:  http://localhost:3000
        run: |
          set -e
          wait_url () { 
            echo "Waiting for $1 ..."
            for i in {1..60}; do
              if curl -fsS "$1" >/dev/null 2>&1; then echo "OK $1"; return 0; fi
              sleep 2
            done
            echo "TIMEOUT $1"; return 1
          }
          wait_url "$BACKEND_URL/api/health"
          wait_url "$FRONTEND_URL"
          wait_url "$PROM_URL/-/ready"
          wait_url "$GRAFANA_URL/login"
          # Also wait for Prometheus to actually scrape both targets
          python - <<'PY'
          import os, time, sys, requests
          prom=os.environ.get("PROM_URL","http://localhost:9090")
          expected={"backend","redis"}  # adjust if your Prometheus job_names differ
          for i in range(45):
              try:
                  r=requests.get(f"{prom}/api/v1/targets", timeout=5)
                  data=r.json()["data"]["activeTargets"]
                  up={t["labels"].get("job") for t in data if t.get("health")=="up"}
                  print("Prometheus up targets:", up)
                  if expected.issubset(up):
                      sys.exit(0)
              except Exception as e:
                  print("targets query error:", e)
              time.sleep(2)
          print("Timed out waiting for Prometheus targets", file=sys.stderr)
          sys.exit(1)
          PY 

      - name: Functional tests
        env:
          FRONTEND_URL: http://localhost:8080
          BACKEND_URL:  http://localhost:8081
          PROM_URL:     http://localhost:9090
          GRAFANA_URL:  http://localhost:3000
          EXPECT_NODE:  "false"
          EXPECT_CADVISOR: "false"
          OUT_JUNIT: reports/functional/results_ci.xml
        run: |
          python tests/functional/test_functional.py

      - name: Short HTTP benchmark
        env:
          URL: http://localhost:8081/api/health
          OUT: reports/benchmarks/http_ci.csv
        run: |
          ./tests/benchmark/http_bench.sh 50 10 || true

      - name: Redis benchmark (compose network)
        run: |
          docker run --rm --network docker_default redis:7-alpine \
            redis-benchmark -h redis -p 6379 -n 50000 --csv > reports/benchmarks/redis_ci.csv

      - name: Charts
        run: |
          python reports/charts.py || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            reports/**
            tests/functional/**
            tests/benchmark/**

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v
